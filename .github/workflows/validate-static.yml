name: Validate static app

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JavaScript syntax check
        run: node --check script.js
      - name: HTML structure smoke check
        run: |
          test -f index.html
          test -f result.html
          grep -q "<!DOCTYPE html>" index.html
          grep -q "<!DOCTYPE html>" result.html
      - name: CSS file smoke check
        run: test -s style.css
